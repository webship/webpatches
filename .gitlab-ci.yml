################################################################################
# GitLab CI configuration for the Web Patches module.
#
# Uses the Drupal Association's GitLab Templates:
# https://project.pages.drupalcode.org/gitlab_templates/
#
# The included templates provide the standard validation and testing jobs
# (composer, phpcs, phpstan, cspell, phpunit, …) and the `pages` job, which
# publishes the mkdocs documentation site from mkdocs.yml + docs/ to
# https://project.pages.drupalcode.org/webpatches/ whenever a documentation
# file changes on the default branch.
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # For now, build and test with Drupal 11.4 and PHP 8.4.
  DRUPAL_CORE: "11.4.x-dev"
  _TARGET_PHP: "8.4"
  # The module allows Drupal ^11.4 || ^12.
  # Uncomment to also test the next core version:
  # OPT_IN_TEST_NEXT_MAJOR: '1'
  _PHPUNIT_CONCURRENT: '1'
